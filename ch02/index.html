<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>02 고난의 여정 · 퍼니싱 스토리 다시보기</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0d0f14; --panel:#151922; --line:#2a3140; --text:#e7e9ee; --muted:#8b93a4;
  --accent:#d9b25f; --dialog:rgba(10,12,18,.86); --choice:rgba(20,24,34,.94);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 16px 20px}
header{width:100%;max-width:var(--w);display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:8px}
header h1{font-size:15px;margin:0 6px 0 0;font-weight:700;white-space:nowrap}
header h1 small{color:var(--muted);font-weight:400;margin-left:6px;font-size:13px}
header h1{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;
  padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;max-width:100%}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:hover,select:hover{border-color:#46506a}
a.btn{display:inline-block;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;
  padding:6px 10px;font-size:13px;text-decoration:none;white-space:nowrap}
a.btn:hover{border-color:#46506a}
body.listing .playonly{display:none}
body:not(.listing) .listonly{display:none}

.list{width:100%;max-width:720px;padding:14px 0 30px}
.list .t1{color:var(--muted);font-size:13px;letter-spacing:.15em}
.list h2{font-size:clamp(22px,4.6vw,32px);margin:6px 0 4px;word-break:keep-all}
.list .sub{color:var(--accent);font-size:14px;margin:0 0 20px}
.eps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.eps button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;font-size:15px;line-height:1.45;
  border-radius:8px;word-break:keep-all;overflow-wrap:anywhere}
.eps button .no{color:var(--accent);font-size:13px;min-width:2.2em;flex:none}
.eps button.last{border-color:rgba(217,178,95,.55)}
.eps button:hover,.eps button:focus-visible{border-color:var(--accent);outline:none}

:root{--w:min(1100px, calc(100vw - 32px), calc((100vh - 130px) * 16 / 9))}
.vn{position:relative;width:100%;max-width:var(--w);user-select:none;-webkit-user-select:none}
.stage{position:relative;z-index:0;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:#000;cursor:pointer;
  container-type:inline-size}
.bg{position:absolute;inset:0;transition:opacity .3s}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.bg.off{opacity:0}
.actor{position:absolute;bottom:0;opacity:0;z-index:2;pointer-events:none;
  transition:left .25s ease,opacity .25s,filter .2s}
.actor.on{opacity:1}
.actor.dim{filter:brightness(.45) saturate(.7)}
.actor img{position:absolute;display:block}
.actor img[hidden]{display:none}
.actor .stand{left:0;top:0;width:100%;height:100%}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.flash.go{animation:flash .28s ease-out}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:7;transition:opacity .35s}
.fade.on{opacity:1}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-5px)}
  60%{transform:translate(-7px,3px)}80%{transform:translate(5px,-2px)}}
.shake{animation:shake .4s}

.theme{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;opacity:0;pointer-events:none;transition:opacity .5s;text-align:center}
.theme.on{opacity:1}
.theme .s{color:var(--accent);font-size:clamp(12px,1.6cqi,18px);letter-spacing:.3em}
.theme .t{font-size:clamp(22px,4.2cqi,46px);font-weight:700;letter-spacing:.08em}
.theme .l{width:min(320px,40%);height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-top:6px}

.dialog{position:absolute;left:3%;right:3%;bottom:4%;min-height:27%;background:var(--dialog);
  border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:12px 22px 18px;z-index:8;cursor:pointer}
.dialog.hide{visibility:hidden}
.name.empty{visibility:hidden}
.name{display:block;font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,18px);margin-bottom:4px;min-height:1.3em}
.text{font-size:clamp(15px,1.9vw,20px);line-height:1.65;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.text.narr{color:#cfd6e4}
.dialog .next{position:absolute;right:16px;bottom:8px;color:var(--accent);font-size:12px;opacity:0;animation:bob 1s infinite}
.dialog.ready .next{opacity:1}
@keyframes bob{50%{transform:translateY(3px)}}

.choices{position:absolute;left:0;right:0;top:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;z-index:11;background:rgba(0,0,0,.4);padding:0 10%}
.choices.on{display:flex}
.choices button{width:100%;max-width:560px;background:var(--choice);border:1px solid rgba(217,178,95,.45);
  padding:11px 16px;font-size:clamp(14px,1.8vw,18px);border-radius:6px;text-align:left;line-height:1.5;word-break:keep-all}
.choices button:hover,.choices button:focus-visible{border-color:var(--accent);background:rgba(40,36,24,.96);outline:none}
.choices button b{color:var(--accent);margin-right:10px;font-weight:600}

.title{position:absolute;inset:0;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:#05060a;text-align:center;gap:6px;padding:12px;cursor:default}
.title.on{display:flex}
.title .t1{color:var(--muted);font-size:clamp(11px,1.4cqi,14px);letter-spacing:.15em}
.title .t2{font-size:clamp(30px,6cqi,60px);font-weight:700;line-height:1.1}
.title .t3{color:var(--accent);font-size:clamp(12px,1.6cqi,16px)}
.title .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.title button,.title a.btn{font-size:15px;padding:9px 26px;border-color:var(--accent)}

.log{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:none;justify-content:center;align-items:flex-start;padding:40px 16px}
.log.on{display:flex}
.log .box{width:100%;max-width:760px;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:14px 18px}
.log .row{padding:8px 0;border-bottom:1px solid var(--line);line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.log .row b{color:var(--accent);display:block;font-size:13px}
.log .row.ch{color:#a8c7ff}
.log .row.sep{color:var(--muted);font-size:12px;text-align:center;border:0}
.log .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

footer{width:100%;max-width:var(--w);color:var(--muted);font-size:12px;line-height:1.6;margin-top:10px}
kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px}

@media (max-width:700px){
  header,.vn,footer{max-width:none}
  body{padding:8px 16px 16px}
  header h1 small{display:none}
  .dialog{position:relative;left:auto;right:auto;bottom:auto;margin-top:8px;min-height:132px;padding:10px 14px 18px}
  .name{font-size:15px}.text{font-size:16px}
  .choices{position:static;display:none;background:none;padding:0;margin-top:8px}
  .choices.on{display:flex}
  .choices button{font-size:15px;padding:10px 12px}
  .title button,.title a.btn{font-size:14px;padding:7px 20px}
  .title .btns{margin-top:6px}
  header h1{font-size:14px}
  .hidesm{display:none}
}
</style>
</head>
<body>
<header>
  <a class="btn" id="tocbtn" href="../index.html">목차</a>

</footer>

<script>
const D = {"no":2,"key":"1/1002","group":"메인 스토리","title":"02 고난의 여정","episodes":[{"id":"zx00201ba","title":"2-1 이상한 새 친구","acts":[{"id":456,"t":"theme","title":"고난의 여정","sub":"챕터 2"},{"id":457,"t":"anim","name":"ThemeEnable"},{"id":1,"ba":"AniZhuanchangEnd","t":"bg","src":"../assets/image/bgstory/bgstory12.webp","cg":false},{"id":1000,"t":"bgm","src":"../assets/audio/m_avg_general/m_avg_general.mp3"},{"id":2,"t":"appear","slot":1,"role":"500001","face":null,"x":0},{"id":3,"t":"fx","path":"FxUiStoryTongxunHalfNew.prefab","slot":1},{"id":4,"ba":"DialogEnable","t":"say","who":"세리카","text":"그레이 레이븐 소대 여러분, 지구로 돌아오는 하강 여행은 순조로우셨나요?","slots":[1]},{"id":5,"t":"shift","slot":1,"x":400,"dur":0.25},{"id":6,"t":"appear","slot":2,"role":"1011001","face":null,"x":-400},{"id":7,"t":"say","who":"리","text":"퍼니싱이 가득한 우주 쓰레기 지대를 여전히 아슬아슬하게 지나온 것만 빼면, 대체로 순조로웠죠.","slots":[2]},{"id":9,"t":"appear","slot":2,"role":"1021001","face":null,"x":-400},{"id":10,"t":"say","who":"루시아","text":"리, 그보다 나은 소대 투입 방법은 없어요. 공중 투하 비행선의 기동력이 충분했으니까 전투기 호위 없이도 그 구역을 지날 수 있었던 거예요.","slots":[2]},{"id":12,"t":"appear","slot":2,"role":"1031001","face":null,"x":-400},{"id":13,"t":"say","who":"리브","text":"루시아... 리 씨는 그냥 농담한 거예요.","slots":[2]},{"id":15,"t":"appear","slot":2,"role":"1021001","face":null,"x":-400},{"id":16,"t":"say","who":"루시아","text":"아... 그런 거였어요?","slots":[2]},{"id":17,"t":"say","who":"세리카","text":"정말 사이가 좋네요... 그건 그렇다 치고.","slots":[1]},{"id":18,"t":"say","who":"세리카","text":"긴 얘기는 생략하죠. 이번 작전의 최종 목표는 \"고문의 여인\"이라는 모델의 특수 침식체(특별 침식체)를 쓰러뜨리고, 그 침식체에게서 \"승격자\"에 관한 정보를 더 얻어 내는 것입니다.","slots":[1]},{"id":19,"t":"say","who":"세리카","text":"다른 소대의 보고에 따르면 이 특수 침식체는 전투력이 매우 강하다고 합니다.","slots":[1]},{"id":20,"t":"say","who":"세리카","text":"이 목표를 달성하려면 먼저 다른 실행 소대와 협력해 전술 임무를 완수해야 합니다. 도시 안 지정 위치에 격리 장치를 연이어 배치해서 격리 필드(격리장)를 만드는 것입니다.","slots":[1]},{"id":21,"t":"say","who":"세리카","text":"최종적으로는 도시를 두르는 고리 모양 격리대를 세워 목표의 행동 범위를 제한합니다.","slots":[1]},{"id":22,"t":"hide","slots":[2]},{"id":23,"t":"appear","slot":2,"role":"1031001","face":null,"x":-400},{"id":24,"t":"say","who":"리브","text":"이런 임무도 오랜만이네요.","slots":[2]},{"id":25,"t":"hide","slots":[2]},{"id":26,"t":"appear","slot":2,"role":"1021001","face":null,"x":-400},{"id":27,"t":"say","who":"루시아","text":"그러게요. 그만큼 이번에 상대할 적이 강하다는 의미겠죠.","slots":[2]},{"id":28,"t":"say","who":"세리카","text":"맞아요. 적이 아주 강한 만큼, \"고문의 여인\"과 마주친 소대는 곧바로 이번 작전에 참가한 모든 소대에 알리고 지원을 기다려야 합니다. 절대 함부로 교전하면 안 돼요.","slots":[1]},{"id":29,"t":"say","who":"루시아","text":"알겠습니다.","slots":[2]},{"id":30,"t":"say","who":"세리카","text":"여러분이 강하한 지점 근처에 봉인해 둔 격리 장치가 있습니다. 다시 가동하려면 어떻게든 권한을 얻어야 할 수도 있어요.","slots":[1]},{"id":31,"t":"say","who":"세리카","text":"참, 본부에서 근처에 있던 구조체 한 명을 파견해서 이번 임무를 지원하도록 배치했습니다. 곧 만나게 될 겁니다.","slots":[1]},{"id":32,"t":"say","who":"세리카","text":"그럼... 행운을 빌어요, 그레이 레이븐.","slots":[1]},{"id":33,"t":"nop"},{"id":34,"t":"hide","slots":[1,2]},{"id":35,"t":"say","who":"시스템","text":"통신이 종료되었습니다.","slots":[]},{"id":36,"t":"appear","slot":1,"role":"1031001","face":null,"x":-400},{"id":37,"t":"appear","slot":2,"role":"1011001","face":null,"x":400},{"id":38,"t":"say","who":"리브","text":"리 씨, 격리 장치에 대해 알고 계세요?","slots":[1]},{"id":39,"t":"say","who":"리","text":"세계 엔지니어 연합(세계 기술사 길드)에서 연구한 최신 제품입니다. 일정 시간 내에 격리 필드(격리장)를 생성하여 침식체를 효과적으로 제압할 수 있어요.","slots":[2]},{"id":40,"t":"say","who":"리","text":"다만 배치하는 데 시간이 걸리고, 엄청 무거워서 다루기도 힘든 물건이죠. 기술사 길드 녀석들은 뭘 만들든 늘 이런 식이라니까요...","slots":[2]},{"id":41,"t":"say","who":"리브","text":"만드는 얘기가 나와서 말인데요... 사실 처음에 리 씨가 기계를 잘 다룬다는 걸 알았을 때는 세계 엔지니어 연합(세계 기술사 길드) 출신인 줄 알았어요. 쿠로노 특별 작전팀 출신일 줄은 몰랐네요.","slots":[1]},{"id":42,"t":"say","who":"리","text":"그 조직의 외부 고용 인원으로 잠깐 일을 했을 뿐입니다.","slots":[2]},{"id":43,"t":"hide","slots":[1,2]},{"id":44,"t":"appear","slot":1,"role":"1041001","face":2,"x":0},{"id":45,"t":"say","who":"？？？","text":"야호~! 그레이 레이븐 소대 여러분~!","slots":[1]},{"id":46,"t":"shift","slot":1,"x":400,"dur":0.25},{"id":47,"t":"appear","slot":2,"role":"1021001","face":4,"x":-400},{"id":48,"t":"say","who":"루시아","text":"혹시 그쪽이 세리카가   const go = await card(last
    ? `<div class="t1">${esc(E.label)}</div><div class="t2">${esc(D.title)}</div><div class="t3">끝</div>` +
      `<div class="btns"><a class="btn" id="endtoc" href="../index.html">목차로</a><button data-go="list">편 목록</button></div>`
    : `<div class="t1">${esc(E.label)}</div><div class="t2">끝</div>` +
      `<div class="btns"><button data-go="next">다음 · ${esc(D.episodes[ep+1].label)}</button></div>`);
  if(my !== token) return;
  if(go === "list"){ showList(); return; }
  ep += 1;
  run();
}

/* ---------- 로그·설정 ---------- */
function drawLog(){
  $("logrows").innerHTML = logs.map(l => {
    if(l.kind === "sep") return `<div class="row sep">— ${esc(l.t)} —</div>`;
    if(l.kind === "choice") return `<div class="row ch">▶ ${esc(l.o.text)}</div>`;
    return `<div class="row">${l.a.who ? `<b>${esc(l.a.who)}</b>` : ""}${esc(l.a.text)}</div>`;
  }).join("");
  const box = $("logrows").parentElement; box.scrollTop = box.scrollHeight;
}
function toggleLog(on){ $("log").classList.toggle("on", on); if(on) drawLog(); }

function drawHead(){
  const E = phase === "list" ? null : D.episodes[ep];
  $("chap").innerHTML = esc(D.title) + (E ? `<small>${esc(E.label)}</small>` : "");
}
function drawList(){
  const last = store.get("last." + D.no);
  $("lgroup").textContent = "퍼니싱: 그레이 레이븐" + (D.group ? " · " + D.group : "");
  $("ltitle").textContent = D.title;
  $("lsub").textContent = `${D.episodes.length}편`;
  $("eps").innerHTML = D.episodes.map((e, i) =>
    `<li><button data-i="${i}"${e.id === last ? ' class="last" title="마지막으로 본 편"' : ""}><span class="no">${i+1}</span>` +
    `<span>${esc(e.label)}</span></button></li>`).join("");
  $("eps").querySelectorAll("button").forEach(b => b.onclick = () => startEp(+b.dataset.i));
}
function showList(){
  token++; resetStage(); toggleLog(false);
  bgm.pause(); bgmSrc = null; auto = false; $("auto").setAttribute("aria-pressed", false);
  phase = "list"; document.body.classList.add("listing"); drawHead(); drawList(); window.scrollTo(0, 0);
}
// 편을 고르면 그 편부터 재생 — 소리는 이 클릭 뒤부터(브라우저 자동재생 제한)
function startEp(i){
  started = true; logs = []; ep = i; phase = "play";
  document.body.classList.remove("listing"); window.scrollTo(0, 0); run();
}
document.title = `${D.title} · 퍼니싱 스토리 다시보기`;
setSound(soundOn);
$("listbtn").onclick = e => { e.currentTarget.blur(); showList(); };
$("restart").onclick = e => { e.currentTarget.blur(); if(phase !== "list") run(); };
$("auto").onclick = e => { auto = !auto; e.currentTarget.setAttribute("aria-pressed", auto); e.currentTarget.blur();
  if(auto && !typing && waiting && waiting.kind === "click" && cur) doneTyping(); };
$("snd").onclick = e => { e.currentTarget.blur(); setSound(!soundOn); };
$("logbtn").onclick = e => { e.currentTarget.blur(); toggleLog(true); };
$("logclose").onclick = () => toggleLog(false);
$("log").onclick = e => { if(e.target.id === "log") toggleLog(false); };
$("stage").onclick = () => advance();
$("dialog").onclick = () => advance();
document.addEventListener("keydown", e => {
  if(phase === "list") return;
  if($("log").classList.contains("on")){ if(e.key === "Escape" || e.key === "l" || e.key === "L") toggleLog(false); return; }
  if(e.key === " " || e.key === "Enter"){
    e.preventDefault();
    if(waiting && waiting.kind === "card"){ const b = $("title").querySelector("button, a.btn"); if(b) b.click(); }
    else if(!curChoice) advance();
  }
  else if(/^[1-9]$/.test(e.key) && curChoice) pick(+e.key - 1);
  else if(e.key === "a" || e.key === "A") $("auto").click();
  else if(e.key === "l" || e.key === "L") toggleLog(true);
});

showList();
window.__vn = {trace, state(){
  return {phase, ep, epId:D.episodes[ep].id, typing:!!typing, waiting:waiting && waiting.kind, choices:curChoice ? curChoice.opts.length : 0,
    choiceId:curChoice ? curChoice.id : null, soundOn, started, bgmPaused:bgm.paused, bgm:bgm.getAttribute("src")};
}};
</script>
