<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퍼니싱 스토리 다시보기</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0d0f14;--panel:#151922;--line:#2a3140;--text:#e7e9ee;--muted:#8b93a4;--accent:#d9b25f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:36px 16px 48px}
.t1{color:var(--muted);font-size:13px;letter-spacing:.15em}
h1{font-size:clamp(24px,5vw,34px);margin:6px 0 4px}
.sub{color:var(--accent);font-size:14px;margin:0 0 26px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a.ch{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;color:var(--text);text-decoration:none}
a.ch:hover,a.ch:focus-visible{border-color:var(--accent);outline:none}
a.ch .g{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
a.ch .tt{display:block;font-size:17px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
a.ch .n{margin-left:auto;color:var(--accent);font-size:13px;white-space:nowrap}
a.ch .main{min-width:0}
</style>
</head>
<body>
<main>
  <div class="t1">퍼니싱: 그레이 레이븐</div>
  <h1>스토리 다시보기</h1>
  <p class="sub">목차</p>
  <ol id="toc"></ol>
</main>
<script>
const TOC = [{"href": "ch01/index.html", "group": "메인 스토리", "title": "01 그라피티 예술", "n": 14}, {"href": "ch02/index.html", "group": "메인 스토리", "title": "02 고난의 여정", "n": 13}];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("toc").innerHTML = TOC.map(c =>
  `<li><a class="ch" href="${esc(c.href)}"><span class="main">${c.group ? `<span class="g">${esc(c.group)}</span>` : ""}` +
  `<span class="tt">${esc(c.title)}</span></span><span class="n">${c.n}편</span></a></li>`).join("");
</script>
</body>
</html>
