<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리브·백야 · 퍼니싱 스토리 다시보기</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0d0f14; --panel:#151922; --line:#2a3140; --text:#e7e9ee; --muted:#8b93a4;
  --accent:#d9b25f; --dialog:rgba(10,12,18,.86); --choice:rgba(20,24,34,.94);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 16px 20px}
header{width:100%;max-width:var(--w);display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:8px}
header h1{font-size:15px;margin:0 6px 0 0;font-weight:700;white-space:nowrap}
header h1 small{color:var(--muted);font-weight:400;margin-left:6px;font-size:13px}
header h1{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;
  padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;max-width:100%}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:hover,select:hover{border-color:#46506a}
a.btn{display:inline-block;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;
  padding:6px 10px;font-size:13px;text-decoration:none;white-space:nowrap}
a.btn:hover{border-color:#46506a}
body.listing .playonly{display:none}
body:not(.listing) .listonly{display:none}

.list{width:100%;max-width:720px;padding:14px 0 30px}
.list .t1{color:var(--muted);font-size:13px;letter-spacing:.15em}
.list h2{font-size:clamp(22px,4.6vw,32px);margin:6px 0 4px;word-break:keep-all}
.list .sub{color:var(--accent);font-size:14px;margin:0 0 20px}
.eps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.eps button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;font-size:15px;line-height:1.45;
  border-radius:8px;word-break:keep-all;overflow-wrap:anywhere}
.eps button .no{color:var(--accent);font-size:13px;min-width:2.2em;flex:none}
.eps button.last{border-color:rgba(217,178,95,.55)}
.eps button:hover,.eps button:focus-visible{border-color:var(--accent);outline:none}

:root{--w:min(1100px, calc(100vw - 32px), calc((100vh - 130px) * 16 / 9))}
.vn{position:relative;width:100%;max-width:var(--w);user-select:none;-webkit-user-select:none}
.stage{position:relative;z-index:0;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:#000;cursor:pointer;
  container-type:inline-size}
.bg{position:absolute;inset:0;transition:opacity .3s}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.bg.off{opacity:0}
.actor{position:absolute;bottom:0;opacity:0;z-index:2;pointer-events:none;
  transition:left .25s ease,opacity .25s,filter .2s}
.actor.on{opacity:1}
.actor.dim{filter:brightness(.45) saturate(.7)}
.actor img{position:absolute;display:block}
.actor img[hidden]{display:none}
.actor .stand{left:0;top:0;width:100%;height:100%}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.flash.go{animation:flash .28s ease-out}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:7;transition:opacity .35s}
.fade.on{opacity:1}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-5px)}
  60%{transform:translate(-7px,3px)}80%{transform:translate(5px,-2px)}}
.shake{animation:shake .4s}

.theme{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;opacity:0;pointer-events:none;transition:opacity .5s;text-align:center}
.theme.on{opacity:1}
.theme .s{color:var(--accent);font-size:clamp(12px,1.6cqi,18px);letter-spacing:.3em}
.theme .t{font-size:clamp(22px,4.2cqi,46px);font-weight:700;letter-spacing:.08em}
.theme .l{width:min(320px,40%);height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-top:6px}

.dialog{position:absolute;left:3%;right:3%;bottom:4%;min-height:27%;background:var(--dialog);
  border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:12px 22px 18px;z-index:8;cursor:pointer}
.dialog.hide{visibility:hidden}
.name.empty{visibility:hidden}
.name{display:block;font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,18px);margin-bottom:4px;min-height:1.3em}
.text{font-size:clamp(15px,1.9vw,20px);line-height:1.65;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.text.narr{color:#cfd6e4}
.dialog .next{position:absolute;right:16px;bottom:8px;color:var(--accent);font-size:12px;opacity:0;animation:bob 1s infinite}
.dialog.ready .next{opacity:1}
@keyframes bob{50%{transform:translateY(3px)}}

.choices{position:absolute;left:0;right:0;top:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;z-index:11;background:rgba(0,0,0,.4);padding:0 10%}
.choices.on{display:flex}
.choices button{width:100%;max-width:560px;background:var(--choice);border:1px solid rgba(217,178,95,.45);
  padding:11px 16px;font-size:clamp(14px,1.8vw,18px);border-radius:6px;text-align:left;line-height:1.5;word-break:keep-all}
.choices button:hover,.choices button:focus-visible{border-color:var(--accent);background:rgba(40,36,24,.96);outline:none}
.choices button b{color:var(--accent);margin-right:10px;font-weight:600}

.title{position:absolute;inset:0;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:#05060a;text-align:center;gap:6px;padding:12px;cursor:default}
.title.on{display:flex}
.title .t1{color:var(--muted);font-size:clamp(11px,1.4cqi,14px);letter-spacing:.15em}
.title .t2{font-size:clamp(30px,6cqi,60px);font-weight:700;line-height:1.1}
.title .t3{color:var(--accent);font-size:clamp(12px,1.6cqi,16px)}
.title .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.title button,.title a.btn{font-size:15px;padding:9px 26px;border-color:var(--accent)}

.log{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:none;justify-content:center;align-items:flex-start;padding:40px 16px}
.log.on{display:flex}
.log .box{width:100%;max-width:760px;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:14px 18px}
.log .row{padding:8px 0;border-bottom:1px solid var(--line);line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.log .row b{color:var(--accent);display:block;font-size:13px}
.log .row.ch{color:#a8c7ff}
.log .row.sep{color:var(--muted);font-size:12px;text-align:center;border:0}
.log .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

footer{width:100%;max-width:var(--w);color:var(--muted);font-size:12px;line-height:1.6;margin-top:10px}
kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px}

@media (max-width:700px){
  header,.vn,footer{max-width:none}
  body{padding:8px 16px 16px}
  header h1 small{display:none}
  .dialog{position:relative;left:auto;right:auto;bottom:auto;margin-top:8px;min-height:132px;padding:10px 14px 18px}
  .name{font-size:15px}.text{font-size:16px}
  .choices{position:static;display:none;background:none;padding:0;margin-top:8px}
  .choices.on{display:flex}
  .choices button{font-size:15px;padding:10px 12px}
  .title button,.title a.btn{font-size:14px;padding:7px 20px}
  .title .btns{margin-top:6px}
  header h1{font-size:14px}
  .hidesm{display:none}
}
</style>

":6,"hx":7}]},{"id":6,"t":"nop"},{"id":7,"t":"bg","src":"../assets/image/bgstory/bgstory16.webp","cg":false},{"id":8,"t":"appear","slot":1,"role":"500404","face":null,"x":0},{"id":9,"t":"say","who":"히포크라테스","text":"이미 늦었습니다. 포기하세요.","slots":[1]},{"id":10,"t":"sel","key":0,"opts":[{"text":"안 돼……!","to":11,"hx":11}]},{"id":11,"t":"sel","key":0,"opts":[{"text":"교수님마저 리브를 포기하신다면,","to":12,"hx":12}]},{"id":12,"t":"sel","key":0,"opts":[{"text":"저희는 정말로 리브를 잃게 됩니다.","to":13,"hx":13}]},{"id":13,"t":"say","who":"히포크라테스","text":"하지만 이건 승격자와 연결하는 것과는 다릅니다. 그쪽은 아직 질서를 유지하고 있습니다.","slots":[1]},{"id":14,"t":"say","who":"히포크라테스","text":"리브는 이미 완전히 침식됐습니다. 지금 연결하면 당신의 마인드 표식도 함께 오염될 겁니다.","slots":[1]},{"id":15,"t":"sel","key":0,"opts":[{"text":"(화서의 일을 알려준다.)","to":16,"hx":16}]},{"id":16,"t":"say","who":"히포크라테스","text":"네? 그러니까…… 화서가 파오스의 창 시스템을 해킹하고 당신의 지휘관 링크에 침입해서, 마인드 표식을 근처 침식체의 오염된 의식의 바다에 강제로 밀어 넣었다는 건가요?","slots":[1]},{"id":17,"t":"sel","key":0,"opts":[{"text":"네, 바로 이 일 때문입니다.","to":18,"hx":18}]},{"id":18,"t":"sel","key":0,"opts":[{"text":"그래서 화서가 제게 승격자와 연결할 능력이 있다고 판단한 겁니다.","to":19,"hx":19}]},{"id":19,"t":"say","who":"히포크라테스","text":"그렇군요. 다들 승격자와 연결하는 능력이 있다고 하길래, 당신이 직접 시험해 보고 얻은 결론인 줄 알았어요.","slots":[1]},{"id":20,"t":"say","who":"히포크라테스","text":"침식체의 의식의 바다는 어떤 느낌이었나요?","slots":[1]},{"id":21,"t":"sel","key":0,"opts":[{"text":"혼란스러운 사고와 무질서한 정보로 가득했습니다.","to":22,"hx":22}]},{"id":22,"t":"say","who":"히포크라테스","text":"그런 환경에서 리브의 의식 조각을 찾아낼 자신이 있나요?","slots":[1]},{"id":23,"t":"sel","key":0,"opts":[{"text":"최소한 시도는 해보고 싶습니다.","to":24,"hx":24}]},{"id":24,"t":"say","who":"","text":"두 연구원은 서로 눈빛을 주고받았지만, 누구도 입을 열지 않았다.","slots":[]},{"id":25,"t":"sel","key":0,"opts":[{"text":"허락해 주십시오.","to":26,"hx":26}]},{"id":26,"t":"say","who":"히포크라테스","text":"솔직히 말씀드리죠. 이건 전장에 내보내는 것과는 다릅니다. 그때는 호위하는 사람도 많았고, 최선을 다했다는 말이라도 할 수 있었습니다.","slots":[1]},{"id":27,"t":"say","who":"히포크라테스","text":"하지만 지금은 다릅니다. 테스트일 뿐이라도 조금만 실수하면 당신은 완전히 미쳐 버릴 겁니다.","slots":[1]},{"id":28,"t":"say","who":"히포크라테스","text":"그렇지 않다면 승격자와 연결할 수 있는 지휘관을 왜 지금까지 당신 한 명밖에 찾지 못했겠습니까? 이 테스트가 그만큼 위험하기 때문입니다.","slots":[1]},{"id":29,"t":"sel","key":0,"opts":[{"text":"저를 믿어주세요.","to":30,"hx":33}]},{"id":30,"t":"nop"},{"id":31,"t":"appear","slot":1,"role":"500404","face":null,"x":0},{"id":32,"t":"appear","slot":2,"role":"500004","face":null,"x":0},{"id":33,"t":"say","who":"히포크라테스＆아시모프","text":"……","slots":[1]},{"id":34,"t":"say","who":"히포크라테스","text":"하……","slots":[1]},{"id":35,"t":"say","who":"아시모프","text":"파오스의 창을 거치면 정보 난류 속 광경 일부를 구체화할 수 있어.","slots":[2]},{"id":36,"t":"say","who":"히포크라테스","text":"……좋은 생각이네요.","slots":[1]},{"id":37,"t":"sel","key":0,"opts":[{"text":"리브를 찾을 기회를 주십시오.","to":38,"hx":38}]},{"id":38,"t":"say","who":"히포크라테스","text":"젊은이, 정말 자기 자신을 좀 더 챙길 생각은 없나요?","slots":[1]},{"id":39,"t":"sel","key":0,"opts":[{"text":"제가 묻고 싶은 건 하나뿐입니다. 성공하면 리브에게는 어떤 영향이 있습니까?","to":40,"hx":40}]},{"id":40,"t":"say","who":"히포크라테스","text":"그건 얼마나 ‘성공’하느냐에 달렸습니다.","slots":[1]},{"id":41,"t":"nop"},{"id":42,"t":"nop"},{"id":43,"t":"bg","src":"../assets/image/bgstory/bgstory00.webp","cg":false},{"id":44,"t":"say","who":"","text":"…………","slots":[]},{"id":45,"t":"say","who":"","text":"그 후에 또 무슨 일이 일어난 거지?","slots":[]},{"id":46,"t":"say","who":"","text":"추억의 거미줄을 잡고 그 가느다란 선을 따라 더 많은 조각을 탐색했다.","slots":[]},{"id":47,"t":"say","who":"","text":"내가 어떻게 리브를 찾았는지 어렴풋이 생각났다.","slots":[]},{"id":48,"t":"nop"},{"id":49,"t":"nop"},{"id":50,"t":"bg","src":"../assets/image/bgstory/bgstory257.webp","cg":false},{"id":51,"t":"bgm","src":"../assets/audio/m_avg_mysterious/m_avg_mysterious.mp3"},{"id":52,"t":"say","who":"","text":"파오스의 창이 구축한 시야를 빌려 데이터 난류 속으로 잠입했다. 첫 조각은 손을 뻗으면 닿을 만큼 가까이 있었고, 그 모습은 배회하는 리브 같았다.","slots":[]},{"id":53,"t":"say","who":"","text":"이건 기적도, 행운도 아니었다. 그레이 레이븐 소대에 쌓인 기억이 서로를 끌어당긴 것이었다.","slots":[]},{"id":54,"t":"say","who":"","text":"아시모프에 따르면 이건 복잡한 그림 속에서 가장 친숙한 것을 찾은 것과 같다고 했다. 과거의 추억은 등대처럼 어떤 안내를 가져다주었다.","slots":[]},{"id":55,"t":"say","who":"","text":"어쩌면…… 구조체도 마인드 표식을 찾아 의식의 바다를 교정할 때, 비슷한 느낌을 받을지 모른다.","slots":[]},{"id":56,"t":"say","who":"","text":"첫 번째 단서를 잡은 뒤 그것과 비슷한 존재를 찾다가 혼란과 무질서한 정보를 따라 새로운 광경에 들어섰다.","slots":[]},{"id":57,"t":"nop"},{"id":58,"t":"bg","src":"../assets/image/bgstory/bgstory438.webp","cg":false},{"id":59,"t":"say","who":"","text":"다음 의식 조각은 난민이 가득한 전장에 있었다.","slots":[]},{"id":60,"t":"say","who":"","text":"폐쇄, 정체, 붕괴.","slots":[]},{"id":61,"t":"say","who":"","text":"사람들이 오랜 세월에 걸쳐 쌓아올린 여과탑은 폐허로 변했고, 다시 개간한 실험용 논은 불에 타 없어졌다.","slots":[]},{"id":62,"t":"say","who":"","text":"수많은 사망자들이 화염과 폐허 속에 묻혀 부패한 악취 속에서 소리 없이 울고 있었다.","slots":[]},{"id":63,"t":"say","who":"","text":"이건 허황한 악몽 따위가 아니라, 실제로 존재하는 현실이자 리브의 기억이었다.","slots":[]},{"id":64,"t":"say","who":"","text":"리브는 이 생지옥 속에서 중상을 입은 생존자를 끌며 앞으로 나아가고 있었다.","slots":[]},{"id":65,"t":"say","who":"","text":"소녀의 가늘고 연약한 모습은 마치 지옥으로 드리워진 거미줄 같았다. 온몸의 기능이 닳아 바닥나기 직전이었고 다리마저 부러졌지만, 그래도 앞으로 나아갔다.","slots":[]},{"id":66,"t":"say","who":"","text":"그녀의 환영을 쫓으려다 빈사 상태의 구조체에게 다리를 붙잡혔다.","slots":[]},{"id":67,"t":"say","who":"","text":"바꿀 수 없는 기억이라는 걸 알면서도, 살려 달라고 매달리는 그 두 손을 뿌리칠 수 없었다.","slots":[]},{"id":68,"t":"say","who":"","text":"이건 그녀의 두 번째 의식 조각이었다.","slots":[]},{"id":69,"t":"say","who":"","text":"그의 남은 생명이 사라진 후, 내 모습은 이미 리브와 겹쳐져 있었다……","slots":[]},{"id":70,"t":"nop"},{"id":71,"t":"bg","src":"../assets/image/bgstory/bgstory32.webp","cg":false},{"id":72,"t":"say","who":"","text":"기억의 이정표를 따라 낡은 야전 병원으로 돌아가, 리브가 잘 아는 사람들을 만났다.","slots":[]},{"id":73,"t":"say","who":"","text":"이곳의 시간 흐름은 매우 빨랐다. 그들의 모습은 마치 타임랩스의 장면처럼 복도와 병실을 지나다녔다.","slots":[]},{"id":74,"t":"say","who":"","text":"햇빛은 창문을 지나 바닥에 그림자를 새기고, 그 그림자를 시곗바늘처럼 돌렸다.","slots":[]},{"id":75,"t":"say","who":"","text":"환자들이 오가며 슬픔과 기쁨, 이별이 지나갔지만, 이곳에는 늘 리브 한 사람뿐이었다.","slots":[]},{"id":76,"t":"say","who":"","text":"소녀는 이미 시간 속에 버려져 어머니의 묘비 앞에 활짝 핀 인동화가 되어 버렸다.","slots":[]},{"id":77,"t":"say","who":"","text":"이건 그녀의 세 번째 의식 조각이었다.","slots":[]},{"id":78,"t":"nop"},{"id":79,"t":"bg","src":"../assets/image/bgstory/bgstory207.webp","cg":false},{"id":80,"t":"say","who":"","text":"인동화가 휘감은 덩굴을 따라 낯익은 모래사장에 들어섰다.","slots":[]},{"id":81,"t":"say","who":"","text":"그곳에는 리브가 그레이 레이븐에서 느낀 따뜻함이 간직되어 있었다. 그곳에 남은 의식 조각도 하나가 아니었다.","slots":[]},{"id":82,"t":"bg","src":"../assets/image/bgstory/bgstory391.webp","cg":false},{"id":83,"t":"say","who":"","text":"밤이 되고서야, 리브의 등 뒤에 희미한 빛줄기 하나가 있는 것이 보였다.","slots":[]},{"id":84,"t":"say","who":"","text":"그 빛줄기는 바다 밑까지 뻗어 있었고, 그곳에서 또 다른 리브가 헤매고 있었다.","slots":[]},{"id":85,"t":"appear","slot":1,"role":"500174","face":null,"x":0},{"id":86,"t":"say","who":"리브","text":"……제가 모두에게 짐이 될까 봐 두려워요.","slots":[1]},{"id":87,"t":"say","who":"","text":"마음의 문이 완전히 열리기 전에 그녀가 마음속 깊이 감춘 외로움과 자책감은 바다의 밑바닥에 잠들어 있었다.","slots":[]},{"id":88,"t":"sel","key":0,"opts":[{"text":"나랑 이곳을 떠나자.","to":89,"hx":89}]},{"id":89,"t":"say","who":"리브","text":"네.","slots":[1]},{"id":90,"t":"nop"},{"id":91,"t":"say","who":"","text":"‘현재’와 ‘미래’의 리브처럼 그녀는 과거의 외로움도 나에게 맡겼다.","slots":[]},{"id":92,"t":"nop"},{"id":93,"t":"nop"},{"id":94,"t":"bg","src":"../assets/image/bgstory/bgstory00.webp","cg":false},{"id":95,"t":"say","who":"","text":"지금까지 의식 조각을 5개 수집했다.","slots":[]},{"id":96,"t":"say","who":"","text":"찾는 과정이 길고 험난했지만, 이건 순조로운 편이었다.","slots":[]},{"id":97,"t":"say","who":"","text":"외부 지원 연구원들은 다음 의식 조각을 찾으면 리브를 깨울 수 있을 거라 생각했다.","slots":[]},{"id":98,"t":"nop"},{"id":99,"t":"nop"},{"id":100,"t":"bg","src":"../assets/image/bgstory/bgstory510.webp","cg":false},{"id":101,"t":"say","who":"","text":"하지만……","slots":[]},{"id":102,"t":"sel","key":0,"opts":[{"text":"난 실패했다.","to":103,"hx":103}]},{"id":103,"t":"say","who":"","text":"그곳에 쓰러진 사람들처럼 침식체의 물결에 파묻혔고, 새빨간 그림자에 몸이 꿰뚫렸다.","slots":[]},{"id":104,"t":"nop"},{"id":105,"t":"nop"},{"id":106,"t":"bg","src":"../assets/image/bgstory/bgstory00.webp","cg":false},{"id":107,"t":"say","who":"","text":"기억 속 상처가 이 순간 다시 찢어지고, 고통과 추억이 거센 파도를 일으켜 아직 더듬어 찾던 이를 허무의 바다로 휩쓸어 갔다.","slots":[]},{"id":108,"t":"say","who":"","text":"그날도 이랬는데……","slots":[]},{"id":109,"t":"say","who":"","text":"혼돈과 무질서가 상처에 파고들어 마인드 표식에 뿌리를 내리고 거침없이 성장했다.","slots":[]},{"id":110,"t":"say","who":"","text":"결국 이 실패는 바꿀 수 없는 걸까?","slots":[]},{"id":111,"t":"say","who":"","text":"결국 이렇게 한 발자국 떨어진 곳에서 쓰러지게 되는 걸까?","slots":[]},{"id":112,"t":"say","who":"","text":"……이제 더 이상 리브를 볼 수 없게 되는 건가?","slots":[]},{"id":113,"t":"say","who":"","text":"지금 어디에 있는 거지? 어떻게 해야 이곳에서 떠날 수 있지? 어떻게 해야 이 상태에서 벗어날 수 있을까?","slots":[]},{"id":114,"t":"say","who":"","text":"되찾은 기억은 아무런 답을 주지 못했다. 그저 허공에서 헛되이 발버둥 치는 나 자신을 내버려 둘 수밖에 없었다.","slots":[]}],"label":"리브·백야·그중 다섯"},{"id":"hg12406ba","title":"리브·백야·그중 여섯","acts":[{"id":1,"ba":"AniZhuanchangEnd","t":"bg","src":"../assets/image/bgstory/bgstory00.webp","cg":false},{"id":2,"t":"bgm","src":"../assets/audio/g_amb_story_wind/g_amb_story_wind.mp3"},{"id":3,"ba":"DialogEnable","t":"say","who":"","text":"감지는 홍수에 떨어진 자갈처럼 더러운 흙탕물 속에서 갈리고, 구르고, 물결치는 대로 휩쓸려 그렇게 수많은 세월을 보냈다.","slots":[]},{"id":4,"t":"say","who":"","text":"온몸의 상처와 피로에, 정신은 이미 무너지기 직전의 한계를 넘어서 있었다.","slots":[]},{"id":5,"t":"say","who":"","text":"어떻게 자신이 가장 기초적인 형태를 유지할 수 있는지, 흔들리는 빛은 생각할 수 없었다.","slots":[]},{"id":6,"t":"say","who":"","text":"되찾은 기억 속에 뿌리 깊은 생각이 남아 있었다…… 난 지금 리브가 걸었던 거센 물결 속에 있다.","slots":[]},{"id":7,"t":"say","who":"","text":"리브도 무수한 기억과 죽음 속에서 떠올랐다 가라앉고, 몸부림치고, 날카로운 가시에 꿰뚫리고, 찢겨 나갔다.","slots":[]},{"id":8,"t":"sel","key":0,"opts":[{"text":"……리브.","to":9,"hx":9}]},{"id":9,"t":"sel","key":0,"opts":[{"text":"리브……","to":10,"hx":10}]},{"id":10,"t":"sel","key":0,"opts":[{"text":"……","to":11,"hx":11}]},{"id":11,"t":"say","who":"","text":"흐릿한 시간은 그녀를 부른 횟수를 기억할 수 없게 했다.","slots":[]},{"id":12,"t":"say","who":"","text":"탁한 흐름 속의 노력은 모두 헛수고일 뿐이었다.","slots":[]},{"id":13,"t":"say","who":"","text":"그렇게 시간은 오랫동안 흐르고 또 흘렀다.","slots":[]},{"id":14,"t":"say","who":"","text":"혼탁한 데이터의 물결을 타고 세상의 끝까지 떠내려갔고…… 포근히 감겨드는 바람이 부드러운 노랫소리를 실어 왔다.","slots":[]},{"id":15,"t":"say","who":"","text":"이것은 자장가여야 했지만, 긴 잠에 빠진 사람을 깨웠다.","slots":[]},{"id":16,"t":"say","who":"","text":"이것도 새장 속의 노래여야 했지만, 갇힌 이에게 열쇠를 건네주었다.","slots":[]},{"id":17,"ea":"AniZhuanchangBegin","t":"say","who":"","text":"노랫소리의 근원을 찾으려 하자 허무의 세상은 점점 입체적으로 변했고, 혼돈 속을 떠돌던 영혼은 마침내 머물 수 있는 항구를 찾을 수 있게 됐다.","slots":[]},{"id":18,"t":"bgm","src":"../assets/audio/m_avg_silence/m_avg_silence.mp3"},{"id":19,"t":"bg","src":"../assets/image/bgcg/cg2301_14.webp","cg":true},{"id":20,"t":"nop"},{"id":21,"t":"bgm","src":"../assets/audio/m_avg_memory/m_avg_memory.mp3"},{"id":22,"ba":"AniZhuanchangEnd","t":"say","who":"","text":"여름 밤의 바람은 창가의 커튼을 스치며 떠났던 그날과 같은 온도를 지니고 있었다.","slots":[]},{"id":23,"t":"say","who":"","text":"리브에게 구조된 새는 그녀의 불안을 진정시키려는 듯 조용히 새장 안에 머물렀다.","slots":[]},{"id":24,"t":"say","who":"","text":"저녁 바람이 아무리 세차게 불어도, 새는 더 이상 바람을 거슬러 날개를 펴고 몸부림치며 날아오르지 않았다.","slots":[]},{"id":25,"t":"say","who":"","text":"동료들과 함께 살던 집은 익숙한 모습을 유지하고 있었다.","slots":[]},{"id":26,"t":"say","who":"","text":"빗물에 쓸려 떨어진 외벽과 창턱에 가득 핀 갖가지 꽃들만이, 소녀가 얼마나 많은 세월을 창턱에서 지켜봤는지 소리 없이 말해 주었다.","slots":[]},{"id":27,"t":"say","who":"","text":"그녀가 꿈꾸던 나날은 진작 외로운 새장이 되었지만, 그녀는 여전히 옛집에 잊힌 등불처럼 그 자리를 지키고 있었다.","slots":[]},{"id":28,"t":"say","who":"","text":"……마치, 그 새장의 새처럼.","slots":[]},{"id":29,"t":"say","who":"","text":"세상의 악몽은 한 번도 깨어난 적이 없었다. 다만 리브가 자신의 꿈으로 그 악몽을 끌어안고 있었을 뿐이다.","slots":[]},{"id":30,"t":"sel","key":0,"opts":[{"text":"……","to":31,"hx":31}]},{"id":31,"t":"say","who":"","text":"깨어난 기억과 허무 속에서 울리던 메아리가 날 재촉했다.","slots":[]},{"id":32,"t":"say","who":"","text":"그녀의 꿈을 깨뜨려야 새장 속의 새도 원래 있던 곳으로 돌아갈 수 있다.","slots":[]},{"id":33,"t":"say","who":"","text":"하지만 그게 정말 좋은 일일까?","slots":[]},{"id":34,"t":"say","who":"","text":"그녀의 꿈속에서 살아온 지 벌써 10년, 하루하루가 평온하고 안온했다.","slots":[]},{"id":35,"t":"say","who":"","text":"그건 그녀가 바라는 세상이자 모든 사람이 바라던 미래, 언젠가는 맞이하게 될 미래이다.","slots":[]},{"id":36,"t":"say","who":"","text":"그러나 그 미래는 너무 멀어서 도착하기 전에 수많은 생명이 추운 겨울 속에 묻힐 것이다.","slots":[]},{"id":37,"t":"say","who":"","text":"열매를 맺지 못한 꽃들이니 꿈속에 남아 있으면 곳곳이 갈라진 현실보다 더 행복할 것이다.","slots":[]},{"id":38,"t":"sel","key":0,"opts":[{"text":"하지만 이건 내 선택이 아니다.","to":39,"hx":39}]},{"id":39,"t":"say","who":"","text":"내 선택이 오기 전에 수많은 사람들이 생사를 선택했다.","slots":[]},{"id":40,"t":"say","who":"","text":"꿈속의 평화가 일찍 현실이 될 수 있도록 그들은 미래를 어둠을 밝히는 등불로 만들었다.","slots":[]},{"id":41,"t":"sel","key":0,"opts":[{"text":"포기는 일종의 배신이다.","to":42,"hx":42}]},{"id":42,"t":"say","who":"","text":"이것이 리브의 꿈이기 때문에 그녀가 이 꿈을 배신하지 않을 것이라고 믿어야 한다.","slots":[]},{"id":43,"ea":"AniZhuanchangBegin","t":"sel","key":0,"opts":[{"text":"그녀와 얘기해 봐야겠다.","to":44,"hx":44}]},{"id":44,"t":"bg","src":"../assets/image/bgstory/bgstory526.webp","cg":false},{"id":46,"t":"appear","slot":1,"role":"500400","face":1,"x":0},{"id":47,"ba":"AniZhuanchangEnd","t":"say","who":"리브","text":"……지휘관님!","slots":[1]},{"id":48,"t":"say","who":"","text":"문을 두드리는 소리가 들리자 소녀는 달밤을 누비는 고양이처럼 날쌔게 위층에서 내려왔다. 그녀는 문을 열고 오랫동안 기다리던 품으로 뛰어들었다.","slots":[]},{"id":49,"t":"sel","key":0,"opts":[{"text":"오래 기다렸지?","to":50,"hx":50}]},{"id":50,"t":"say","who":"리브","text":"괜찮아요…… 지휘관님이 돌아오셨으니까요.","slots":[1]},{"id":51,"t":"say","who":"","text":"그녀는 세게 안으면 앞에 있는 환영이 없어질까 봐 품속에서 가볍게 떨고 있었다.","slots":[]},{"id":52,"t":"sel","key":0,"opts":[{"text":"나 여기 있어.","to":53,"hx":53},{"text":"(리브를 안았다.)","to":53,"hx":53}]},{"id":53,"t":"say","who":"리브","text":"네…… 지휘관님……","slots":[1]},{"id":54,"t":"sel","key":0,"opts":[{"text":"……리브, 사실……","to":55,"hx":55}]},{"id":55,"t":"say","who":"","text":"아무리 아쉬움이 사무쳐도, 작별을 고하지 않을 수 없었다.","slots":[]},{"id":56,"t":"face","slot":1,"face":14},{"id":57,"t":"say","who":"리브","text":"네……","slots":[1]},{"id":58,"t":"say","who":"리브","text":"이미 알고 있어요.","slots":[1]},{"id":59,"t":"say","who":"","text":"눈물에 젖은 소녀가 먼저 이별을 말했다.","slots":[]},{"id":60,"t":"say","who":"리브","text":"……이곳은 제 의식의 바다에 남아 있는 하나의 꿈일 뿐이에요.","slots":[1]},{"id":61,"t":"say","who":"리브","text":"그리고 제 의식 조각을 찾으려고 여기까지 와 주신…… 지휘관님이에요.","slots":[1]},{"id":62,"t":"say","who":"리브","text":"제…… 우리 지휘관님이요.","slots":[1]},{"id":63,"t":"say","who":"","text":"다시 만났을 때 그녀는 이미 호칭을 바꿨지만 여전히 감정을 통제하지는 못했다.","slots":[]},{"id":64,"t":"say","who":"","text":"……통제할 필요는 없었다.","slots":[]},{"id":65,"t":"say","who":"리브","text":"지휘관님과 모두를 찾기 위해 전 이 세상을 계속 탐색했어요.","slots":[1]},{"id":66,"t":"say","who":"리브","text":"많은 시간이 걸렸지만, 마침내…… 제 자신을 찾았어요.","slots":[1]},{"id":67,"t":"say","who":"","text":"리브의 시선을 따라 바라보니 새장 속의 흰 새는 여전히 바람에 흔들리고 있었다.","slots":[1]},{"id":68,"t":"sel","key":0,"opts":[{"text":"……저거?","to":69,"hx":69}]},{"id":69,"t":"say","who":"리브","text":"맞아요…… 그게 제 의식 조각이에요.","slots":[1]},{"id":70,"t":"sel","key":0,"opts":[{"text":"……그럼 넌……","to":71,"hx":71}]},{"id":71,"t":"say","who":"","text":"그녀의 꿈에 떨어지기 전, 난 조각을 찾기 위해 이와 비슷한 수많은 환상을 거쳤는데——그건 아시모프가 파오스의 창으로 데이터를 가시화한 결과였다.","slots":[]},{"id":72,"t":"say","who":"","text":"리브의 의식 조각은 대개 자기 모습을 한 채, 몇몇 기억이 서로 만나는 곳을 배회하고 있었다.","slots":[]},{"id":73,"t":"say","who":"리브","text":"……전 단지 의식의 바다에 남아있는 꿈이자, 저 흰 새의 환상일 뿐이에요.","slots":[1]},{"id":74,"t":"say","who":"리브","text":"지휘관님은 이곳에 오기 전의 일을 기억하시나요?","slots":[1]},{"id":75,"ea":"AniZhuanchangBegin","t":"sel","key":0,"opts":[{"text":"기억해.","to":76,"hx":78}]},{"id":76,"t":"hide","slots":[1]},{"id":78,"t":"bg","src":"../assets/image/bgcg/cg2301_4.webp","cg":true},{"id":79,"t":"fx","path":"FxUiStoryShuju.prefab","slot":0},{"id":80,"ba":"AniZhuanchangEnd","t":"say","who":"","text":"그건 여섯 번째 조각을…… 마지막 의식 조각이라고 믿었던 조각을 찾던 중에 일어난 일이었다.","slots":[]},{"id":81,"t":"say","who":"","text":"수많은 이합 생물과 침식체에 파묻힌 인간의, 한탄스러울 만큼 짧은 두 손은 아무리 발버둥 쳐도 하늘에 떠 있는 빛에 닿지 않았다.","slots":[]},{"id":82,"t":"sel","key":0,"opts":[{"text":"리브!!","to":83,"hx":83}]},{"id":83,"t":"say","who":"","text":"고함소리는 군중 속에 파묻혔고, 이미 빛 속에 사라진 소녀는 잡을 수 없었다.","slots":[]},{"id":84,"t":"say","who":"","text":"리브는 기꺼이 새장 속에 남은 새와 같았다. 백야 기체가 변화와 구원의 힘을 줄 수만 있다면, 그 새장이 얼마나 큰 고통을 주더라도 결코 도망치지 않을 것이다.","slots":[]},{"id":85,"t":"say","who":"","text":"혹시 여기서 기다리다 보면 언젠가 그녀 앞에 있는 날이 오지 않을까?","slots":[]},{"id":86,"t":"say","who":"","text":"그러나 뒤에 있는 적은 그렇게 생각하지 않았다.","slots":[]},{"id":87,"ea":"AniZhuanchangBegin","t":"say","who":"","text":"그걸 알아차렸을 때는 머리의 다쳤던 자리에서 다시 피가 흐르고 있었고, 극심한 고통이 마인드 표식을 혼란과 오염의 바다로 끌어내렸다.","slots":[]},{"id":88,"t":"nop"},{"id":89,"t":"bgm","src":"../assets/audio/m_ev9_intro/m_ev9_intro.mp3"},{"id":90,"t":"bg","src":"../assets/image/bgstory/bgstory0.webp","cg":false},{"id":91,"ba":"AniZhuanchangEnd","t":"sel","key":0,"opts":[{"text":"그때, 난 흰색의 작은 새 한 마리를 보았다.","to":92,"hx":92}]},{"id":92,"ea":"AniZhuanchangBegin","t":"sel","key":0,"opts":[{"text":"그 새의 자취를 쫓자, 혼란스러웠던 시야가 밝아지기 시작했다.","to":93,"hx":93}]},{"id":93,"t":"bg","src":"../assets/image/bgstory/bgstory95.webp","cg":false},{"id":94,"ba":"AniZhuanchangEnd","t":"say","who":"","text":"하지만 그 새는 점점 자취를 감추었고, 그 바람에 인간은 영원히 멈추지 않는 눈보라 속에서 길을 잃었다.","slots":[]},{"id":95,"t":"sel","key":0,"opts":[{"text":"눈보라 속에서 난 오랫동안 걸었다.","to":96,"hx":96}]},{"id":96,"ea":"AniZhuanchangBegin","t":"sel","key":0,"opts":[{"text":"내 시체와…… 명패를 볼 때까지.","to":97,"hx":97}]},{"id":97,"t":"bg","src":"../assets/image/bgstory/bgstory514.webp","cg":false},{"id":98,"t":"appear","slot":1,"role":"500400","face":14,"x":0},{"id":99,"ba":"AniZhuanchangEnd","t":"say","who":"리브","text":"그래도 지휘관님은 깨어나셨잖아요.","slots":[1]},{"id":100,"t":"sel","key":0,"opts":[{"text":"아니, 네가 날 찾은 거야.","to":101,"hx":101}]},{"id":101,"t":"say","who":"","text":"이 평온한 환상에 감싸여 있었기에, 꺼져 가던 불길은 난류 속에서도 살아남을 수 있었던 것이다.","slots":[]},{"id":102,"t":"sel","key":0,"opts":[{"text":"고마워, 리브.","to":103,"hx":104}]},{"id":103,"t":"face","slot":1,"face":1},{"id":104,"t":"say","who":"리브","text":"네, 저도 마찬가지예요.","slots":[1]},{"id":105,"t":"say","who":"리브","text":"이건 꿈일 뿐이지만 지휘관님과 모두가 이곳에서 함께 보낸 10년은 절대 허황된 거품이 아니에요.","slots":[1]},{"id":106,"t":"say","who":"리브","text":"고마워요……","slots":[1]},{"id":107,"t":"hide","slots":[1]},{"id":108,"t":"say","who":"","text":"리브의 눈물은 닦아 주려던 손끝에 떨어져, 그대로 손바닥 안에 꼭 쥐어졌다.","slots":[]},{"id":109,"t":"appear","slot":1,"role":"500400","face":2,"x":0},{"id":110,"t":"say","who":"리브","text":"전 만족해요. 이제…… 꿈에서 깨야 할 때예요.","slots":[1]},{"id":111,"t":"fx","path":"FxUiStoryShuju.prefab","slot":0},{"id":112,"ba":"RImgBg1Shake","t":"say","who":"","text":"창 밖에서 흰 새가 날개를 퍼덕이는 소리 const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k){ try{ return localStorage.getItem("pgrvn."+k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem("pgrvn."+k, v) }catch(e){} },
};
const W = 1920, H = 1080;   // 연출 좌표계(가로 1920 기준, x=0이 가운데)

let ep = 0, token = 0, waiting = null, typing = null, auto = false, cur = null, curChoice = null;
let logs = [], actors = {}, mem = null, phase = "list", snapped = false;
let soundOn = store.get("sound") !== "0", started = false, bgmSrc = null;
const bgm = new Audio(); bgm.loop = true; bgm.preload = "auto";
const trace = [];  // 확인용 기록(화면에 그린 상태)

/* ---------- 소리 ---------- */
function playBgm(src){
  bgmSrc = src;
  if(!soundOn || !started){ return; }
  if(bgm.getAttribute("src") !== src){ bgm.setAttribute("src", src); }
  const p = bgm.play(); if(p) p.catch(()=>{});
}
function playSe(src){
  if(!soundOn || !started) return;
  const a = new Audio(src); const p = a.play(); if(p) p.catch(()=>{});
}
function setSound(on){
  soundOn = on; store.set("sound", on ? "1" : "0");
  $("snd").setAttribute("aria-pressed", on); $("snd").textContent = on ? "소리 켬" : "소리 끔";
  if(!on) bgm.pause(); else if(bgmSrc) playBgm(bgmSrc);
}

/* ---------- 화면 요소 ---------- */
function setBg(a){
  const img = $("bgimg");
  img.setAttribute("src", a.src); img.alt = a.cg ? "이벤트 CG" : "배경";
  $("bg").classList.remove("off");
}
function slotOf(n){
  if(!actors[n]){
    const el = document.createElement("div"); el.className = "actor"; el.dataset.slot = n;
    el.innerHTML = `<img class="stand" alt=""><img class="face" alt="" hidden>`;
    $("actors").appendChild(el);
    actors[n] = {el, role:null, face:null, x:0};
  }
  return actors[n];
}
function drawActor(n){
  const s = actors[n]; if(!s || !s.role) return;
  const r = D.roles[s.role]; if(!r) return;
  const el = s.el, st = el.querySelector(".stand"), fc = el.querySelector(".face");
  el.style.width = (r.w / W * 100) + "%";
  el.style.height = (r.h / H * 100) + "%";
  el.style.left = ((W/2 + s.x - r.w/2) / W * 100) + "%";
  el.style.zIndex = 2 + (+n);
  if(st.getAttribute("src") !== r.img) st.setAttribute("src", r.img);
  const f = s.face != null ? r.faces[String(s.face)] : null;
  if(f){
    const [bx, by, bw, bh] = r.box, cx = bx + bw/2, cy = by + bh/2;
    fc.style.left = ((cx - f.w/2) / r.w * 100) + "%";
    fc.style.top = ((cy - f.h/2) / r.h * 100) + "%";
    fc.style.width = (f.w / r.w * 100) + "%";
    fc.style.height = (f.h / r.h * 100) + "%";
    if(fc.getAttribute("src") !== f.src) fc.setAttribute("src", f.src);
    fc.hidden = false;
  } else { fc.hidden = true; fc.removeAttribute("src"); }
}
function shake(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function flash(){ const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }

async function anim(name){
  if(name === "AniZhuanchangBegin"){ $("dialog").classList.add("hide"); $("fade").classList.add("on"); await sleep(380); }
  else if(name === "AniZhuanchangEnd"){ $("fade").classList.remove("on"); await sleep(250); }
  else if(name === "RImgBg1Shake") shake($("bg"));
  else { const m = /^PanelActor(\d+)Shake$/.exec(name); if(m && actors[m[1]]) shake(actors[m[1]].el); }
}
// 대기: 시간이 지나거나 클릭하면 넘어간다
function pause(ms){
  return new Promise(res => {
    const done = () => { clearTimeout(t); if(waiting && waiting.res === done) waiting = null; res(); };
    const t = setTimeout(done, ms);
    waiting = {kind:"delay", res:done};
  });
}

/* ---------- 대사·선택지 ---------- */
function snapshot(a){
  const E = D.episodes[ep];
  trace.push({ep:E.id, id:a.id, who:a.who, text:a.text, shown:$("text").textContent, name:$("name").textContent,
    bg:$("bg").classList.contains("off") ? null : $("bgimg").getAttribute("src"), bgm:bgmSrc,
    actors:Object.entries(actors).filter(([,s]) => s.el.classList.contains("on")).map(([n,s]) => ({slot:+n, role:s.role,
      stand:s.el.querySelector(".stand").getAttribute("src"),
      face:s.el.querySelector(".face").hidden ? null : s.el.querySelector(".face").getAttribute("src"),
      dim:s.el.classList.contains("dim")}))});
}
function say(a){
  cur = a; snapped = false; $("theme").classList.remove("on");
  $("dialog").classList.remove("hide","ready");
  const sp = (a.slots || []).map(String);
  for(const [n,s] of Object.entries(actors))
    s.el.classList.toggle("dim", !!a.who && sp.length > 0 && !sp.includes(n) && s.el.classList.contains("on"));
  $("name").textContent = a.who; $("name").classList.toggle("empty", !a.who);
  $("text").classList.toggle("narr", !a.who);
  logs.push({kind:"say", a});
  return new Promise(res => {
    waiting = {kind:"click", res};
    const chars = [...a.text]; let i = 0;
    $("text").textContent = "";
    const step = () => {
      i += 1; $("text").textContent = chars.slice(0, i).join("");
      if(i < chars.length) typing = setTimeout(step, 26); else doneTyping();
    };
    typing = setTimeout(step, 0);
  });
}
function doneTyping(){
  clearTimeout(typing); typing = null;
  if(!cur) return;
  $("text").textContent = cur.text; $("dialog").classList.add("ready");
  if(!snapped){ snapped = true; snapshot(cur); }
  if(auto && waiting && waiting.kind === "click"){
    const w = waiting, n = [...cur.text].length;
    setTimeout(() => { if(auto && waiting === w) advance(); }, 1000 + n * 45);
  }
}
function choose(a){
  curChoice = a; drawChoices(); phase = "choice";
  return new Promise(res => { waiting = {kind:"choice", res}; });
}
function drawChoices(){
  const box = $("choices"); box.innerHTML = "";
  if(!curChoice){ box.classList.remove("on"); return; }
  curChoice.opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.innerHTML = `<b>${i+1}</b>${esc(o.text)}`;
    b.onclick = e => { e.stopPropagation(); pick(i); };
    box.appendChild(b);
  });
  box.classList.add("on");
}
function pick(i){
  if(!waiting || waiting.kind !== "choice" || !curChoice.opts[i]) return;
  const o = curChoice.opts[i], w = waiting;
  logs.push({kind:"choice", o}); trace.push({ep:D.episodes[ep].id, choice:curChoice.id, pick:i});
  waiting = null; curChoice = null; drawChoices(); phase = "play";
  w.res(o.to);
}
function advance(){
  if(typing){ doneTyping(); return; }
  if(waiting && (waiting.kind === "click" || waiting.kind === "delay")){ const w = waiting; waiting = null; w.res(); }
}

/* ---------- 진행 ---------- */
function resetStage(){
  clearTimeout(typing); typing = null; waiting = null; cur = null; curChoice = null;
  $("actors").innerHTML = ""; actors = {}; mem = null;
  $("bg").classList.add("off"); $("fade").classList.add("on"); $("theme").classList.remove("on");
  $("dialog").classList.add("hide"); $("choices").classList.remove("on"); $("title").classList.remove("on");
}
function card(html){
  const t = $("title"); t.innerHTML = html; t.classList.add("on");
  return new Promise(res => {
    const go = v => { t.classList.remove("on"); res(v); };
    t.querySelectorAll("button").forEach(b => b.onclick = e => {
      e.stopPropagation(); if(waiting && waiting.res === go) waiting = null; go(b.dataset.go); });
    waiting = {kind:"card", res:go};
  });
}
function preload(E){
  const seen = new Set();
  const add = s => { if(s && !seen.has(s)){ seen.add(s); const i = new Image(); i.src = s; } };
  for(const a of E.acts){
    if(a.t === "bg") add(a.src);
    if(a.t === "appear"){ const r = D.roles[a.role]; if(r){ add(r.img); Object.values(r.faces).forEach(f => add(f.src)); } }
  }
}
async function run(){
  const my = ++token; resetStage(); phase = "play";
  const E = D.episodes[ep]; const idx = new Map(E.acts.map((a, i) => [a.id, i]));
  drawHead(); store.set("last." + D.no, E.id); preload(E);
  logs.push({kind:"sep", t:E.label});
  trace.push({ep:E.id, start:1});
  let pc = 0;
  while(pc < E.acts.length){
    const a = E.acts[pc];
    trace.push({ep:E.id, act:a.id});
    if(a.bd) await pause(a.bd);
    const fadeIn = a.ba === "AniZhuanchangEnd";
    if(a.ba && !fadeIn) await anim(a.ba);
    if(my !== token) return;
    let jump = null;
    switch(a.t){
      case "bg": setBg(a); break;
      case "bgm": playBgm(a.src); break;
      case "se": playSe(a.src); break;
      case "appear": { const s = slotOf(a.slot);
        s.role = a.role; s.face = a.face; s.x = a.x;
        s.el.style.transition = "none"; drawActor(a.slot); void s.el.offsetWidth; s.el.style.transition = "";
        s.el.classList.add("on"); s.el.classList.remove("dim"); break; }
      case "hide": for(const n of a.slots) if(actors[n]) actors[n].el.classList.remove("on","dim"); break;
      case "shift": { const s = actors[a.slot]; if(s){ s.x = a.x; s.el.style.transition = `left ${a.dur || 0}s ease, opacity .25s, filter .2s`;
        drawActor(a.slot); } break; }
      case "face": { const s = actors[a.slot]; if(s){ s.face = a.face; drawActor(a.slot); } break; }
      case "say": if(fadeIn) $("fade").classList.remove("on"); await say(a); break;
      case "sel": { const to = await choose(a);
        if(a.key) mem = to; else jump = to; break; }   // 키가 있으면 기록만 하고 이어 감
      case "recall": if(mem != null) jump = mem; break; // 기록한 선택으로 분기
      case "theme": $("theme").innerHTML = `<div class="s">${esc(a.sub)}</div><div class="t">${esc(a.title)}</div><div class="l"></div>`;
        $("theme").classList.add("on"); break;
      case "anim": break;
      case "fx": if(/Hit/i.test(a.path)){ flash(); if(actors[a.slot]) shake(actors[a.slot].el); } break;
    }
    if(my !== token) return;
    if(fadeIn && a.t !== "say") await anim("AniZhuanchangEnd");
    if(a.ed) await pause(a.ed);
    if(a.t === "anim" && a.name === "ThemeEnable") $("theme").classList.remove("on");
    if(a.ea) await anim(a.ea);
    if(my !== token) return;
    if(a.end) break;
    const nid = jump ?? a.next;
    pc = nid != null ? idx.get(nid) : pc + 1;
    if(pc === undefined){ console.error("이동할 동작 없음", E.id, nid); break; }
  }
  if(my !== token) return;
  trace.push({ep:E.id, done:1});
  $("dialog").classList.add("hide"); $("fade").classList.add("on"); $("theme").classList.remove("on");
  const last = ep >= D.episodes.length - 1;
  phase = last ? "final" : "end";
  const go = await card(last
    ? `<div class="t1">${esc(E.label)}</div><div class="t2">${esc(D.title)}</div><div class="t3">끝</div>` +
      `<div class="btns"><a class="btn" id="endtoc" href="../index.html">목차로</a><button data-go="list">편 목록</button></div>`
    : `<div class="t1">${esc(E.label)}</div><div class="t2">끝</div>` +
      `<div class="btns"><button data-go="next">다음 · ${esc(D.episodes[ep+1].label)}</button></div>`);
  if(my !== token) return;
  if(go === "list"){ showList(); return; }
  ep += 1;
  run();
}

/* ---------- 로그·설정 ---------- */
function drawLog(){
  $("logrows").innerHTML = logs.map(l => {
    if(l.kind === "sep") return `<div class="row sep">— ${esc(l.t)} —</div>`;
    if(l.kind === "choice") return `<div class="row ch">▶ ${esc(l.o.text)}</div>`;
    return `<div class="row">${l.a.who ? `<b>${esc(l.a.who)}</b>` : ""}${esc(l.a.text)}</div>`;
  }).join("");
  const box = $("logrows").parentElement; box.scrollTop = box.scrollHeight;
}
function toggleLog(on){ $("log").classList.toggle("on", on); if(on) drawLog(); }

function drawHead(){
  const E = phase === "list" ? null : D.episodes[ep];
  $("chap").innerHTML = esc(D.title) + (E ? `<small>${esc(E.label)}</small>` : "");
}
function drawList(){
  const last = store.get("last." + D.no);
  $("lgroup").textContent = "퍼니싱: 그레이 레이븐" + (D.group ? " · " + D.group : "");
  $("ltitle").textContent = D.title;
  $("lsub").textContent = `${D.episodes.length}편`;
  $("eps").innerHTML = D.episodes.map((e, i) =>
    `<li><button data-i="${i}"${e.id === last ? ' class="last" title="마지막으로 본 편"' : ""}><span class="no">${i+1}</span>` +
    `<span>${esc(e.label)}</span></button></li>`).join("");
  $("eps").querySelectorAll("button").forEach(b => b.onclick = () => startEp(+b.dataset.i));
}
function showList(){
  token++; resetStage(); toggleLog(false);
  bgm.pause(); bgmSrc = null; auto = false; $("auto").setAttribute("aria-pressed", false);
  phase = "list"; document.body.classList.add("listing"); drawHead(); drawList(); window.scrollTo(0, 0);
}
// 편을 고르면 그 편부터 재생 — 소리는 이 클릭 뒤부터(브라우저 자동재생 제한)
function startEp(i){
  started = true; logs = []; ep = i; phase = "play";
  document.body.classList.remove("listing"); window.scrollTo(0, 0); run();
}
document.title = `${D.title} · 퍼니싱 스토리 다시보기`;
setSound(soundOn);
$("listbtn").onclick = e => { e.currentTarget.blur(); showList(); };
$("restart").onclick = e => { e.currentTarget.blur(); if(phase !== "list") run(); };
$("auto").onclick = e => { auto = !auto; e.currentTarget.setAttribute("aria-pressed", auto); e.currentTarget.blur();
  if(auto && !typing && waiting && waiting.kind === "click" && cur) doneTyping(); };
$("snd").onclick = e => { e.currentTarget.blur(); setSound(!soundOn); };
$("logbtn").onclick = e => { e.currentTarget.blur(); toggleLog(true); };
$("logclose").onclick = () => toggleLog(false);
$("log").onclick = e => { if(e.target.id === "log") toggleLog(false); };
$("stage").onclick = () => advance();
$("dialog").onclick = () => advance();
document.addEventListener("keydown", e => {
  if(phase === "list") return;
  if($("log").classList.contains("on")){ if(e.key === "Escape" || e.key === "l" || e.key === "L") toggleLog(false); return; }
  if(e.key === " " || e.key === "Enter"){
    e.preventDefault();
    if(waiting && waiting.kind === "card"){ const b = $("title").querySelector("button, a.btn"); if(b) b.click(); }
    else if(!curChoice) advance();
  }
  else if(/^[1-9]$/.test(e.key) && curChoice) pick(+e.key - 1);
  else if(e.key === "a" || e.key === "A") $("auto").click();
  else if(e.key === "l" || e.key === "L") toggleLog(true);
});

showList();
window.__vn = {trace, state(){
  return {phase, ep, epId:D.episodes[ep].id, typing:!!typing, waiting:waiting && waiting.kind, choices:curChoice ? curChoice.opts.length : 0,
    choiceId:curChoice ? curChoice.id : null, soundOn, started, bgmPaused:bgm.paused, bgm:bgm.getAttribute("src")};
}};
</script>
